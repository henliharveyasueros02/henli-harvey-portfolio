<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading — Henli Harvey Asueros</title>
  <meta name="robots" content="noindex,nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#FAFAF8;--accent:#D4956A;--accent-dark:#B87040;--text:#1C1C1C;}
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;color:var(--text)}
    .loader-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
    .logo{font-family:'Playfair Display',Georgia,serif;font-size:28px;color:var(--text);letter-spacing:0.06em}
    .tag{color:#6B6B6B;font-size:0.95rem}
    .spinner{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,rgba(212,149,106,0.12),rgba(184,112,64,0.06));box-shadow:0 6px 20px rgba(0,0,0,0.06)}
    .spinner lottie-player{width:100%;height:100%;}
    .progress{width:220px;height:8px;background:#efe9e2;border-radius:999px;overflow:hidden}
    .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-dark));transition:width 220ms ease}
    .skip{margin-top:12px;font-size:0.85rem;color:#6B6B6B}
    .skip button{background:none;border:1px solid transparent;color:var(--accent);padding:6px 10px;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <main class="loader-wrap" role="main" aria-labelledby="load-heading">
    <div class="logo">HHA</div>
    <div id="load-heading" class="tag">Streamline your operations — loading...</div>
    <div class="spinner" aria-hidden="true">
      <lottie-player src="https://assets8.lottiefiles.com/packages/lf20_x62chJ.json" background="transparent" speed="1" loop autoplay></lottie-player>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
    <div class="skip"><button id="skip-btn">Skip</button></div>
  </main>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

<script>
(() => {
  const target = 'index.html';
  const bar = document.getElementById('bar');
  const skip = document.getElementById('skip-btn');
  let value = 0;
  const step = 8; // ms between frames
  const max = 96; // final simulated percent before redirect

  // Try to preload key images to make the transition feel smoother
  const assets = ['images/me.png'];
  let loadedCount = 0;
  assets.forEach(src => {
    const img = new Image();
    img.src = src + '?t=' + Date.now();
    img.onload = () => { loadedCount++; };
    img.onerror = () => { loadedCount++; };
  });

  const interval = setInterval(() => {
    // accelerate while images are loading
    const targetWidth = Math.min(max, value + (loadedCount ? 6 : 4));
    value = Math.min(100, value + (Math.random()*6 + 4));
    if (value >= targetWidth) value = targetWidth;
    bar.style.width = value + '%';
    bar.parentElement.setAttribute('aria-valuenow', Math.round(value));
    if (value >= max) {
      clearInterval(interval);
      // small delay to feel deliberate
      setTimeout(() => { window.location.href = target; }, 600);
    }
  }, step);

  skip.addEventListener('click', () => { window.location.href = target; });

  // allow Escape to skip
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.location.href = target; });
})();
</script>
</body>
</html>
